# Multi-container deployment — one shared image, isolated project bundles per service.
#
# On EC2: clone/copy this repo (or deploy job uploads compose + nginx), write `.env`
# from docs/DEPLOYMENT.md, then `docker compose pull && docker compose up -d`.
#
# Host port mapping (optional direct access; NGINX is the public entrypoint):
#   prestige → localhost:3000
#   godrej   → localhost:3001
#   golden   → localhost:3002

name: estates-platform

services:
  prestige:
    image: ${DOCKERHUB_USER}/${IMAGE_NAME:-real-estate-platform}:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_PROJECT_SLUG: prestige-kollur
      ENQUIRY_SCRIPT_URL: ${PRESTIGE_ENQUIRY_SCRIPT_URL:-${ENQUIRY_SCRIPT_URL:-}}
    ports:
      - "${PRESTIGE_HOST_PORT:-3000}:3000"
    expose:
      - "3000"
    networks:
      - web
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  godrej:
    image: ${DOCKERHUB_USER}/${IMAGE_NAME:-real-estate-platform}:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_PROJECT_SLUG: godrej-kukatpally
      ENQUIRY_SCRIPT_URL: ${GODREJ_ENQUIRY_SCRIPT_URL:-${ENQUIRY_SCRIPT_URL:-}}
    ports:
      - "${GODREJ_HOST_PORT:-3001}:3000"
    expose:
      - "3000"
    networks:
      - web
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  golden-doors:
    image: ${DOCKERHUB_USER}/${IMAGE_NAME:-real-estate-platform}:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_PROJECT_SLUG: golden-doors
      ENQUIRY_SCRIPT_URL: ${GOLDEN_DOORS_ENQUIRY_SCRIPT_URL:-${ENQUIRY_SCRIPT_URL:-}}
    ports:
      - "${GOLDEN_DOORS_HOST_PORT:-3002}:3000"
    expose:
      - "3000"
    networks:
      - web
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      prestige:
        condition: service_healthy
      godrej:
        condition: service_healthy
      golden-doors:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      # Mount TLS certs when ready:
      # - ./docker/nginx/certs:/etc/nginx/certs:ro
    environment:
      PRESTIGE_DOMAIN: ${PRESTIGE_DOMAIN:-prestige.example.com}
      GODREJ_DOMAIN: ${GODREJ_DOMAIN:-godrej.example.com}
      GOLDEN_DOORS_DOMAIN: ${GOLDEN_DOORS_DOMAIN:-goldendoors.example.com}
    command:
      - /bin/sh
      - -c
      - |
        envsubst '$${PRESTIGE_DOMAIN} $${GODREJ_DOMAIN} $${GOLDEN_DOORS_DOMAIN}' \
          < /etc/nginx/templates/projects.conf.template \
          > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    networks:
      - web

networks:
  web:
    driver: bridge
