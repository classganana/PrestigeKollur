# Docker Hub → EC2. Build args = only NEXT_PUBLIC_* needed for this project (see .env.local).
# Deploy uploads docker-compose.yml then writes .env (Docker Hub user, enquiry URL, host port).
#
# Secrets (Settings → Secrets and variables → Actions):
#   DOCKER_USERNAME, DOCKER_PASSWORD
#   EC2_HOST, EC2_USER, EC2_SSH_KEY
#   ENQUIRY_SCRIPT_URL
#   NEXT_PUBLIC_SITE_URL
#   NEXT_PUBLIC_ANALYTICS_ID
#   NEXT_PUBLIC_META_PIXEL_ID
#   NEXT_PUBLIC_WHATSAPP_PHONE
#   NEXT_PUBLIC_WHATSAPP_PREFILL_MESSAGE
#   NEXT_PUBLIC_VOICE_PHONE
#   NEXT_PUBLIC_ENQUIRY_EMAIL
#   NEXT_PUBLIC_ENQUIRY_SCRIPT_URL
#   NEXT_PUBLIC_DOC_BROCHURE_PDF
#   NEXT_PUBLIC_TOWNSHIP_FLYTHROUGH_SRC
#
# EC2: Docker + Compose. Inbound TCP = HOST_PORT below (default 3001).

name: Docker Build and Push

on:
  push:
    branches:
      - main

env:
  # Must match Docker Hub repo name (lowercase): hub.docker.com/.../prestigekollur
  IMAGE_NAME: prestigekollur

permissions:
  contents: read
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_PROJECT_SLUG=prestige-kollur
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ANALYTICS_ID=${{ secrets.NEXT_PUBLIC_ANALYTICS_ID }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
            NEXT_PUBLIC_WHATSAPP_PHONE=${{ secrets.NEXT_PUBLIC_WHATSAPP_PHONE }}
            NEXT_PUBLIC_WHATSAPP_PREFILL_MESSAGE=${{ secrets.NEXT_PUBLIC_WHATSAPP_PREFILL_MESSAGE }}
            NEXT_PUBLIC_VOICE_PHONE=${{ secrets.NEXT_PUBLIC_VOICE_PHONE }}
            NEXT_PUBLIC_ENQUIRY_EMAIL=${{ secrets.NEXT_PUBLIC_ENQUIRY_EMAIL }}
            NEXT_PUBLIC_ENQUIRY_SCRIPT_URL=${{ secrets.NEXT_PUBLIC_ENQUIRY_SCRIPT_URL }}
            NEXT_PUBLIC_DOC_BROCHURE_PDF=${{ secrets.NEXT_PUBLIC_DOC_BROCHURE_PDF }}
            NEXT_PUBLIC_TOWNSHIP_FLYTHROUGH_SRC=${{ secrets.NEXT_PUBLIC_TOWNSHIP_FLYTHROUGH_SRC }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}
      ENQUIRY_SCRIPT_URL: ${{ secrets.ENQUIRY_SCRIPT_URL }}
      # Host port on EC2 (change if 3001 is also taken); open this port in the security group.
      HOST_PORT: "3001"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload docker-compose.yml to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.EC2_USER }}/prestige-kollur

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USER,ENQUIRY_SCRIPT_URL,HOST_PORT
          command_timeout: 15m
          script: |
            set -euo pipefail
            mkdir -p ~/prestige-kollur
            cd ~/prestige-kollur
            umask 077
            {
              printf 'DOCKERHUB_USER=%s\n' "$DOCKERHUB_USER"
              printf 'ENQUIRY_SCRIPT_URL=%s\n' "$ENQUIRY_SCRIPT_URL"
              printf 'HOST_PORT=%s\n' "$HOST_PORT"
            } > .env
            docker compose pull
            docker compose up -d --no-deps --force-recreate
            docker image prune -af
            docker ps
