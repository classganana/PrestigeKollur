# Multi-project platform — Docker Hub → EC2 with NGINX domain routing.
#
# ONE image contains standalone bundles for all registered projects.
# Each compose service selects its bundle via NEXT_PUBLIC_PROJECT_SLUG.
#
# See docs/DEPLOYMENT.md for secrets matrix and operational runbook.
#
# ─── Shared secrets ────────────────────────────────────────────────────────────
#   DOCKER_USERNAME, DOCKER_PASSWORD
#   EC2_HOST, EC2_USER, EC2_SSH_KEY
#
# ─── Prestige build-time (prefix PRESTIGE_, legacy unprefixed also supported) ─
#   PRESTIGE_NEXT_PUBLIC_SITE_URL  (fallback: NEXT_PUBLIC_SITE_URL)
#   PRESTIGE_NEXT_PUBLIC_ANALYTICS_ID, PRESTIGE_NEXT_PUBLIC_META_PIXEL_ID
#   PRESTIGE_NEXT_PUBLIC_WHATSAPP_PHONE, …
#
# ─── Godrej build-time (prefix GODREJ_) ───────────────────────────────────────
#   GODREJ_NEXT_PUBLIC_SITE_URL, GODREJ_NEXT_PUBLIC_ANALYTICS_ID, …
#
# ─── EC2 runtime (.env on server, optional deploy vars below) ─────────────────
#   PRESTIGE_DOMAIN, GODREJ_DOMAIN, PRESTIGE_ENQUIRY_SCRIPT_URL, GODREJ_ENQUIRY_SCRIPT_URL

name: Docker Build and Push

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: real-estate-platform

permissions:
  contents: read
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Prestige — legacy unprefixed secrets still work via prepare-build-envs.sh
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_ANALYTICS_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
      NEXT_PUBLIC_WHATSAPP_PHONE: ${{ secrets.NEXT_PUBLIC_WHATSAPP_PHONE }}
      NEXT_PUBLIC_WHATSAPP_PREFILL_MESSAGE: ${{ secrets.NEXT_PUBLIC_WHATSAPP_PREFILL_MESSAGE }}
      NEXT_PUBLIC_VOICE_PHONE: ${{ secrets.NEXT_PUBLIC_VOICE_PHONE }}
      NEXT_PUBLIC_ENQUIRY_EMAIL: ${{ secrets.NEXT_PUBLIC_ENQUIRY_EMAIL }}
      NEXT_PUBLIC_ENQUIRY_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_ENQUIRY_SCRIPT_URL }}
      NEXT_PUBLIC_DOC_BROCHURE_PDF: ${{ secrets.NEXT_PUBLIC_DOC_BROCHURE_PDF }}
      NEXT_PUBLIC_TOWNSHIP_FLYTHROUGH_SRC: ${{ secrets.NEXT_PUBLIC_TOWNSHIP_FLYTHROUGH_SRC }}
      # Prestige prefixed
      PRESTIGE_NEXT_PUBLIC_SITE_URL: ${{ secrets.PRESTIGE_NEXT_PUBLIC_SITE_URL }}
      PRESTIGE_NEXT_PUBLIC_ANALYTICS_ID: ${{ secrets.PRESTIGE_NEXT_PUBLIC_ANALYTICS_ID }}
      PRESTIGE_NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.PRESTIGE_NEXT_PUBLIC_META_PIXEL_ID }}
      PRESTIGE_NEXT_PUBLIC_WHATSAPP_PHONE: ${{ secrets.PRESTIGE_NEXT_PUBLIC_WHATSAPP_PHONE }}
      PRESTIGE_NEXT_PUBLIC_WHATSAPP_PREFILL_MESSAGE: ${{ secrets.PRESTIGE_NEXT_PUBLIC_WHATSAPP_PREFILL_MESSAGE }}
      PRESTIGE_NEXT_PUBLIC_VOICE_PHONE: ${{ secrets.PRESTIGE_NEXT_PUBLIC_VOICE_PHONE }}
      PRESTIGE_NEXT_PUBLIC_ENQUIRY_EMAIL: ${{ secrets.PRESTIGE_NEXT_PUBLIC_ENQUIRY_EMAIL }}
      PRESTIGE_NEXT_PUBLIC_ENQUIRY_SCRIPT_URL: ${{ secrets.PRESTIGE_NEXT_PUBLIC_ENQUIRY_SCRIPT_URL }}
      PRESTIGE_NEXT_PUBLIC_DOC_BROCHURE_PDF: ${{ secrets.PRESTIGE_NEXT_PUBLIC_DOC_BROCHURE_PDF }}
      PRESTIGE_NEXT_PUBLIC_TOWNSHIP_FLYTHROUGH_SRC: ${{ secrets.PRESTIGE_NEXT_PUBLIC_TOWNSHIP_FLYTHROUGH_SRC }}
      # Godrej prefixed
      GODREJ_NEXT_PUBLIC_SITE_URL: ${{ secrets.GODREJ_NEXT_PUBLIC_SITE_URL }}
      GODREJ_NEXT_PUBLIC_ANALYTICS_ID: ${{ secrets.GODREJ_NEXT_PUBLIC_ANALYTICS_ID }}
      GODREJ_NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.GODREJ_NEXT_PUBLIC_META_PIXEL_ID }}
      GODREJ_NEXT_PUBLIC_WHATSAPP_PHONE: ${{ secrets.GODREJ_NEXT_PUBLIC_WHATSAPP_PHONE }}
      GODREJ_NEXT_PUBLIC_WHATSAPP_PREFILL_MESSAGE: ${{ secrets.GODREJ_NEXT_PUBLIC_WHATSAPP_PREFILL_MESSAGE }}
      GODREJ_NEXT_PUBLIC_VOICE_PHONE: ${{ secrets.GODREJ_NEXT_PUBLIC_VOICE_PHONE }}
      GODREJ_NEXT_PUBLIC_ENQUIRY_EMAIL: ${{ secrets.GODREJ_NEXT_PUBLIC_ENQUIRY_EMAIL }}
      GODREJ_NEXT_PUBLIC_ENQUIRY_SCRIPT_URL: ${{ secrets.GODREJ_NEXT_PUBLIC_ENQUIRY_SCRIPT_URL }}
      GODREJ_NEXT_PUBLIC_DOC_BROCHURE_PDF: ${{ secrets.GODREJ_NEXT_PUBLIC_DOC_BROCHURE_PDF }}
      GODREJ_NEXT_PUBLIC_TOWNSHIP_FLYTHROUGH_SRC: ${{ secrets.GODREJ_NEXT_PUBLIC_TOWNSHIP_FLYTHROUGH_SRC }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare per-project build env files
        run: chmod +x docker/prepare-build-envs.sh && ./docker/prepare-build-envs.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_NAME: real-estate-platform
      ENQUIRY_SCRIPT_URL: ${{ secrets.ENQUIRY_SCRIPT_URL }}
      PRESTIGE_ENQUIRY_SCRIPT_URL: ${{ secrets.PRESTIGE_ENQUIRY_SCRIPT_URL }}
      GODREJ_ENQUIRY_SCRIPT_URL: ${{ secrets.GODREJ_ENQUIRY_SCRIPT_URL }}
      PRESTIGE_DOMAIN: ${{ secrets.PRESTIGE_DOMAIN }}
      GODREJ_DOMAIN: ${{ secrets.GODREJ_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose and NGINX config to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.host-nginx.yml,docker/nginx
          target: /home/${{ secrets.EC2_USER }}/estates-platform

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USER,IMAGE_NAME,ENQUIRY_SCRIPT_URL,PRESTIGE_ENQUIRY_SCRIPT_URL,GODREJ_ENQUIRY_SCRIPT_URL,PRESTIGE_DOMAIN,GODREJ_DOMAIN
          command_timeout: 20m
          script: |
            set -euo pipefail
            mkdir -p ~/estates-platform
            cd ~/estates-platform
            umask 077
            {
              printf 'DOCKERHUB_USER=%s\n' "$DOCKERHUB_USER"
              printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME"
              printf 'ENQUIRY_SCRIPT_URL=%s\n' "$ENQUIRY_SCRIPT_URL"
              printf 'PRESTIGE_ENQUIRY_SCRIPT_URL=%s\n' "$PRESTIGE_ENQUIRY_SCRIPT_URL"
              printf 'GODREJ_ENQUIRY_SCRIPT_URL=%s\n' "$GODREJ_ENQUIRY_SCRIPT_URL"
              printf 'PRESTIGE_DOMAIN=%s\n' "${PRESTIGE_DOMAIN:-prestige.example.com}"
              printf 'GODREJ_DOMAIN=%s\n' "${GODREJ_DOMAIN:-godrej.example.com}"
              printf 'PRESTIGE_HOST_PORT=3001\n'
              printf 'GODREJ_HOST_PORT=3002\n'
            } > .env
            if [ -d ~/prestige-kollur ]; then
              (cd ~/prestige-kollur && docker compose down) || true
            fi
            cd ~/estates-platform
            test -f docker-compose.host-nginx.yml
            docker compose -f docker-compose.host-nginx.yml pull
            docker compose -f docker-compose.host-nginx.yml up -d --remove-orphans
            docker image prune -af
            docker compose -f docker-compose.host-nginx.yml ps
